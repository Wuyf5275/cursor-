name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: node18-win-x64
            platform: win-x64
            ext: .exe
          - os: macos-latest
            target: node18-macos-x64
            platform: macos-x64
            ext: ''
          - os: macos-latest
            target: node18-macos-arm64
            platform: macos-arm64
            ext: ''
          - os: ubuntu-latest
            target: node18-linux-x64
            platform: linux-x64
            ext: ''
          - os: ubuntu-24.04-arm
            target: node18-linux-arm64
            platform: linux-arm64
            ext: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Build executable
        run: npx pkg . --out-path dist --targets ${{ matrix.target }} --no-bytecode --public-packages "*"

      - name: Rename output
        shell: bash
        run: |
          cd dist
          mv cursor-i18n-tool${{ matrix.ext }} cursor-i18n-tool-${{ matrix.platform }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-i18n-tool-${{ matrix.platform }}
          path: dist/cursor-i18n-tool-${{ matrix.platform }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate release notes
        run: |
          TAG="${{ github.ref_name }}"
          sed "s/{{TAG_NAME}}/$TAG/g" RELEASE_NOTES.md > /tmp/release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_file: /tmp/release_body.md
          files: artifacts/*
